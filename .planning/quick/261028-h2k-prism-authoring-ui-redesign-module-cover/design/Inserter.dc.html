<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Block library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#3A3A44}
button{font:inherit;cursor:pointer}
a{color:#7A36BD;text-decoration:none}a:hover{color:#6D2BAB}
.tile:hover{border-color:#C5A1E8}
</style>
</helmet>
<div style="font-family: Geist, system-ui, sans-serif; color: #17171C; background: #3A3A44; min-height: 960px; padding: 48px 24px; box-sizing: border-box; display: flex; justify-content: center; align-items: flex-start">

  <div role="dialog" aria-label="Insert a block" style="width: 100%; max-width: 1080px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 24px 64px rgba(0,0,0,0.35); overflow: hidden; display: flex; flex-direction: column">

    <!-- Search -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid #E6E6EB">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6E7A" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label style="flex: 1 1 auto; display: flex">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search blocks</span>
        <input type="search" placeholder="Search blocks, or describe what you need — “quiz with 4 options”" style="flex: 1 1 auto; border: 0; outline: 0; font: inherit; font-size: 16px; background: transparent">
      </label>
      <span style="font-size: 12px; color: #6E6E7A">Tip: type <span style="border: 1px solid #E6E6EB; border-radius: 6px; padding: 1px 6px; color: #17171C">/</span> anywhere in a lesson</span>
      <a href="Main.dc.html" aria-label="Close" style="width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #4B4B57; background: #F3F3F6">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-wrap: wrap; min-height: 640px">
      <!-- Categories -->
      <nav aria-label="Block categories" style="flex: 0 0 220px; padding: 14px 10px; border-right: 1px solid #E6E6EB; background: #FAFAFB; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
          <button type="button" onClick="{{c.pick}}" style="{{c.style}}">
            <span style="{{c.dot}}"></span>
            <span style="flex: 1 1 auto; text-align: left">{{c.label}}</span>
            <span style="font-size: 12px; color: #6E6E7A">{{c.count}}</span>
          </button>
        </sc-for>
        <div style="flex: 1 1 auto"></div>
        <a href="Inserter.dc.html" style="margin: 8px 4px 0; padding: 12px; border-radius: 12px; background: #F3EAFB; color: #6D2BAB; font-size: 13px; line-height: 1.45; display: flex; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: 0 0 auto; margin-top: 2px" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"></path></svg>
          <span><strong>Generate a block</strong><br>Describe it and AI drafts it in your theme.</span>
        </a>
      </nav>

      <!-- Tiles -->
      <div style="flex: 999 1 420px; min-width: 0; padding: 22px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 600">{{catLabel}}</h2>
          <span style="font-size: 13px; color: #4B4B57">{{catHint}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px">
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
            <button type="button" class="tile" onClick="{{t.pick}}" style="{{t.style}}">
              <span style="{{t.thumb}}">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
                <span style="display: flex; flex-direction: column; gap: 4px; width: 60%">
                  <span style="height: 4px; border-radius: 2px; background: currentColor; opacity: 0.35; width: 100%"></span>
                  <span style="height: 4px; border-radius: 2px; background: currentColor; opacity: 0.2; width: 70%"></span>
                </span>
              </span>
              <span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px; text-align: left">
                <span style="font-size: 14px; font-weight: 600">{{t.name}}</span>
                <span style="font-size: 12px; color: #4B4B57; line-height: 1.4">{{t.desc}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 22px; border-top: 1px solid #E6E6EB; background: #FAFAFB">
      <span style="font-size: 13px; color: #4B4B57">Inserting after <strong style="color: #17171C">“Verify, then log”</strong> in Lesson 3</span>
      <div style="flex: 1 1 0"></div>
      <span style="font-size: 12px; color: #6E6E7A">Arrow keys to browse · Enter to insert</span>
      <a href="Main.dc.html" style="height: 38px; padding: 0 16px; border-radius: 10px; background: #8C43D0; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center">Insert {{selName}}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'check', sel: 'Multiple choice' }; }
  renderVals() {
    const I = {
      text: 'M4 7V4h16v3M9 20h6M12 4v16',
      head: 'M6 4v16M18 4v16M6 12h12',
      cols: 'M3 4h7v16H3zM14 4h7v16h-7z',
      quote: 'M3 21c3 0 7-1 7-8V5H3v7h4M14 21c3 0 7-1 7-8V5h-7v7h4',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      table: 'M3 3h18v18H3zM3 9h18M3 15h18M9 3v18',
      image: 'M3 3h18v18H3zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 21',
      video: 'M23 7l-7 5 7 5zM1 5h15v14H1z',
      audio: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
      zap: 'M13 2 3 14h9l-1 8 10-12h-9z',
      compare: 'M12 3v18M3 3h18v18H3z',
      grid: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
      acc: 'M3 5h18M3 12h18M3 19h18M17 3l2 2-2 2',
      tabs: 'M3 7h18v14H3zM3 7V3h6v4M9 3h6v4',
      cards: 'M2 6h14v14H2zM8 2h14v14',
      steps: 'M4 6h2M4 12h2M4 18h2M10 6h10M10 12h10M10 18h10',
      pin: 'M12 22s-7-6-7-12a7 7 0 0 1 14 0c0 6-7 12-7 12zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      target: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      click: 'M9 9l5 12 1.8-5.2L21 14zM7.2 2.2 8 5.1M5.1 8l-2.9-.8M14 4.1 12 6M6 12l-1.9 2',
      check: 'M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4 12 14l-3-3',
      multi: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
      tf: 'M17 7H7a5 5 0 0 0 0 10h10a5 5 0 0 0 0-10zM7 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      blank: 'M3 12h4M17 12h4M9 12h6M3 18h18M3 6h18',
      match: 'M6 3v6a6 6 0 0 0 6 6h6M18 15l-3-3M18 15l-3 3M6 21v-6',
      sort: 'M3 16l4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16',
      csv: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-6M9 15l3 3 3-3',
      branch: 'M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9',
      bulb: 'M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z',
      minus: 'M3 12h18',
      lock: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
      code: 'M16 18l6-6-6-6M8 6l-6 6 6 6',
      star: 'M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z'
    };
    const C = {
      text: { label: 'Text', color: '#4B4B57', bg: '#F3F3F6', hint: 'Prose, headings, lists and tables', items: [
        ['Paragraph', 'Plain body text', 'text'], ['Heading + paragraph', 'A titled section of prose', 'head'], ['Two columns', 'Side-by-side text', 'cols'], ['Statement', 'One big, bold sentence', 'text'], ['Pull quote', 'Quote with attribution', 'quote'], ['Bulleted list', 'Key points, scannable', 'list'], ['Table', 'Rows and columns', 'table']] },
      media: { label: 'Media', color: '#0E6B5C', bg: '#E2F0EC', hint: 'Images, video, sound and motion', items: [
        ['Image', 'Full-width or centred', 'image'], ['Image + text', 'Picture beside copy', 'cols'], ['Gallery', 'Grid or carousel', 'grid'], ['Video', 'YouTube, Vimeo or upload', 'video'], ['Audio', 'Clip with transcript', 'audio'], ['Animation', 'Lottie, plays inline', 'zap'], ['Before / after', 'Drag to compare', 'compare']] },
      interactive: { label: 'Interactive', color: '#1D5FD1', bg: '#E6EEFC', hint: 'Let learners explore at their own pace', items: [
        ['Accordion', 'Expand one topic at a time', 'acc'], ['Tabs', 'Switch between panels', 'tabs'], ['Flashcards', 'Flip to reveal the answer', 'cards'], ['Process', 'Step through a sequence', 'steps'], ['Labeled graphic', 'Pins on an image', 'pin'], ['Hotspots', 'Click to discover', 'target'], ['Reveal cards', 'Tap cards to uncover', 'grid'], ['Button', 'Link out or jump ahead', 'click']] },
      check: { label: 'Knowledge check', color: '#8C43D0', bg: '#F3EAFB', hint: 'Scored questions — they feed the SCORM score', items: [
        ['Multiple choice', 'One correct answer', 'check'], ['Multiple response', 'Several correct answers', 'multi'], ['True / false', 'A quick binary check', 'tf'], ['Fill in the blanks', 'Type the missing words', 'blank'], ['Matching', 'Pair terms with meanings', 'match'], ['Sort order', 'Put steps in sequence', 'sort'], ['Import questions', 'From CSV or the question bank', 'csv']] },
      scenario: { label: 'Scenario', color: '#9A4A0B', bg: '#FDF1E4', hint: 'Decisions with consequences', items: [
        ['Branching scenario', 'Choices lead to different outcomes', 'branch'], ['Conversation', 'A character asks, the learner answers', 'branch']] },
      structure: { label: 'Structure', color: '#26143D', bg: '#E8ECEB', hint: 'Pace and frame the lesson', items: [
        ['Callout', 'Tip, note or warning', 'bulb'], ['Divider', 'Line, dots or space', 'minus'], ['Continue gate', 'Pause until the learner is ready', 'lock'], ['Section banner', 'Full-width themed heading', 'head']] },
      team: { label: 'Team templates', color: '#5C2E3A', bg: '#F7E9EC', hint: 'Blocks your team saved for reuse', items: [
        ['Policy reminder', 'Saved by Jonas · used 14×', 'star'], ['Scenario intro', 'Saved by Priya · used 6×', 'star'], ['Lesson summary', 'Saved by you · used 22×', 'star']] },
      advanced: { label: 'Advanced', color: '#4B4B57', bg: '#F3F3F6', hint: 'Escape hatches', items: [
        ['Custom HTML', 'Embed code, styles scoped', 'code']] }
    };
    const order = ['text', 'media', 'interactive', 'check', 'scenario', 'structure', 'team', 'advanced'];
    const cur = this.state.cat;
    const cats = order.map((id) => ({
      label: C[id].label, count: C[id].items.length,
      pick: () => this.setState({ cat: id, sel: C[id].items[0][0] }),
      dot: 'width: 10px; height: 10px; border-radius: 3px; background: ' + C[id].color + ';',
      style: 'display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 10px; font-size: 14px; color: #17171C;' + (cur === id ? ' background: #FFFFFF; font-weight: 600; box-shadow: 0 1px 3px rgba(23,23,28,0.1);' : ' background: transparent;')
    }));
    const c = C[cur];
    const tiles = c.items.map(([name, desc, icon]) => {
      const on = this.state.sel === name;
      return {
        name, desc, d: I[icon],
        pick: () => this.setState({ sel: name }),
        thumb: 'height: 96px; background: ' + c.bg + '; color: ' + c.color + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;',
        style: 'display: flex; flex-direction: column; padding: 0; background: #FFFFFF; border-radius: 14px; overflow: hidden; color: #17171C;' + (on ? ' border: 2px solid #8C43D0; box-shadow: 0 0 0 4px #EEE2FA;' : ' border: 1px solid #E6E6EB;')
      };
    });
    return { cats, tiles, catLabel: c.label, catHint: c.hint, selName: this.state.sel };
  }
}
</script>
</body>
</html>
